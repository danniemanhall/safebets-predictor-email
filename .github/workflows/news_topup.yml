name: News top-up

# Collects news for the backtest a little at a time and saves it in
# news_cache/. The news archive refuses most requests from GitHub's shared
# servers, so each run asks steadily, at the archive's own pace, and keeps
# whatever lands. Only assets with no saved news, or news more than 7 days
# old, are fetched; when everything is fresh a run ends in under a minute.
# Reads public news data only; it never contacts SafeBets.

on:
  schedule:
    - cron: "17 3,15 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: safebets-news
  cancel-in-progress: false

jobs:
  topup:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-predict.txt

      - name: Install dependencies
        run: pip install -r requirements-predict.txt

      - name: Download news
        run: python news_bakeoff.py --download-news --max-age 7 --news-minutes 40

      - name: Save the news to the repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -d news_cache ]; then git add news_cache; fi
          if git diff --cached --quiet; then
            echo "No new news to save."
          else
            git commit -m "Update saved news"
            git pull --rebase
            git push
          fi
