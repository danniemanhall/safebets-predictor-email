name: Daily predictions

# Emails the day's 104 predictions. The method comes from the latest news
# backtest (backtest_result.json): the tile price, unless a model has beaten
# it in testing. Reads public price and news data only; it never contacts
# SafeBets, and the predictions are entered by hand.
#
# 05:30 UTC = 07:30 in South Africa. GitHub's scheduler often runs 5-15
# minutes late; the email carries its own time stamp.

on:
  schedule:
    - cron: "30 5 * * *"
  workflow_dispatch:

concurrency:
  group: daily-predictions
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-predict.txt

      - name: Install dependencies
        run: pip install -r requirements-predict.txt

      - name: Send today's predictions
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: python predict_daily.py
