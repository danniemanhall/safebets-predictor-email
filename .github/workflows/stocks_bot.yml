name: SafeBets Bot - Stocks & Chips

on:
  schedule:
    - cron: '15 19 * * 1-5'  # Mon-Fri at 3:15 PM EST (19:15 UTC)
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt
          playwright install chromium

      - name: Execute Stocks Bot
        env:
          SAFEBETS_EMAIL: ${{ secrets.SAFEBETS_EMAIL }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python bot.py --group stocks
