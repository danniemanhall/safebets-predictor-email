name: SafeBets Bot - Commodities

on:
  schedule:
    - cron: '15 20 * * 1-5'  # Mon-Fri at 4:15 PM EST (20:15 UTC)
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt
          playwright install chromium

      - name: Execute Commodities Bot
        env:
          SAFEBETS_SESSION: ${{ secrets.SAFEBETS_SESSION }}
          
        run: python bot.py --group commodities
