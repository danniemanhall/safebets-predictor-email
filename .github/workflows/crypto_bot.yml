name: SafeBets Bot - Crypto

on:
  schedule:
    - cron: '45 22 * * *'  # Daily at 5:45 PM EST (22:45 UTC)
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt
          patchright install chromium

      - name: Execute Crypto Bot
        env:
          SAFEBETS_SESSION: ${{ secrets.SAFEBETS_SESSION }}
          
        run: python bot.py --group crypto
